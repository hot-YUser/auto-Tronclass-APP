name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust tests and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # 1.97.1
        with:
          toolchain: 1.97.1 # rust-toolchain.toml 固定
          components: clippy,rustfmt
      - name: Rustfmt
        run: cargo fmt --manifest-path core/Cargo.toml --all -- --check
      - name: Test
        run: cargo test --manifest-path core/Cargo.toml --locked --all-targets --all-features
      - name: Clippy
        run: cargo clippy --manifest-path core/Cargo.toml --locked --all-targets --all-features -- -D warnings

  windows:
    name: Windows checks and unsigned release dry-run
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 工具鏈單一真理：tools/toolchain.json；版本寫入 GITHUB_ENV 供 shell 步驟使用。
      - name: Load toolchain pins
        id: load-toolchain
        shell: pwsh
        run: |
          $cfg = Get-Content -Raw tools/toolchain.json | ConvertFrom-Json
          "DOTNET_SDK_VERSION=$($cfg.dotnetSdk)" >> $env:GITHUB_ENV
          "MAUI_WORKLOAD_SET=$($cfg.mauiWorkloadSet)" >> $env:GITHUB_ENV
          "CARGO_NDK_VERSION=$($cfg.cargoNdk)" >> $env:GITHUB_ENV
          "ANDROID_NDK_VERSION=$($cfg.androidNdk)" >> $env:GITHUB_ENV
          "dotnet-sdk=$($cfg.dotnetSdk)" >> $env:GITHUB_OUTPUT
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # 1.97.1
        with:
          toolchain: 1.97.1 # rust-toolchain.toml 固定
          components: clippy
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ steps.load-toolchain.outputs.dotnet-sdk }}
      - name: Verify installed .NET SDK matches toolchain.json
        shell: pwsh
        run: |
          $actual = dotnet --version
          if ($actual.Trim() -ne $env:DOTNET_SDK_VERSION) {
            throw "dotnet SDK 不符 tools/toolchain.json：需要 $env:DOTNET_SDK_VERSION；實際 $actual"
          }
      - name: Install MAUI Windows workload
        shell: pwsh
        run: dotnet workload install maui-windows --version $env:MAUI_WORKLOAD_SET
      - name: Install MAUI Android workload (multi-target project restore dependency)
        shell: pwsh
        run: dotnet workload install maui-android --version $env:MAUI_WORKLOAD_SET
      - name: Run protocol contract check
        shell: pwsh
        run: dotnet run --project tools/checks/ProtocolContract.Check/ProtocolContract.Check.csproj -c Release
      - name: Run device-key check
        shell: pwsh
        run: dotnet run --project tools/checks/DeviceKey.Check/DeviceKey.Check.csproj -c Release
      - name: Run UI settings check
        shell: pwsh
        run: dotnet run --project tools/checks/UiSettings.Check/UiSettings.Check.csproj -c Release
      # Unsigned Windows release dry-run：走真實 release.ps1 路徑（cargo test/clippy、
      # native marker、Release publish、版本驗證、隔離資料 smoke、zip、SHA256SUMS），
      # 但跳過 Android 簽章與 Inno installer（私鑰只在發行機，永不進 CI）。
      - name: Unsigned Windows release dry-run
        shell: pwsh
        run: ./tools/release.ps1 -Tag v0.0.0-alpha.0 -SkipAndroid -SkipInstaller
      - name: Upload release dry-run dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release-dry-run
          path: dist/
          if-no-files-found: error

  android:
    name: Android UI and native ABI build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 工具鏈單一真理：tools/toolchain.json；版本寫入 GITHUB_ENV 供 shell 步驟使用，
      # ndk-path 以 step output 提供給 cache path（不硬編版本）。
      - name: Load toolchain pins
        id: load-toolchain
        shell: pwsh
        run: |
          $cfg = Get-Content -Raw tools/toolchain.json | ConvertFrom-Json
          "DOTNET_SDK_VERSION=$($cfg.dotnetSdk)" >> $env:GITHUB_ENV
          "MAUI_WORKLOAD_SET=$($cfg.mauiWorkloadSet)" >> $env:GITHUB_ENV
          "CARGO_NDK_VERSION=$($cfg.cargoNdk)" >> $env:GITHUB_ENV
          "ANDROID_NDK_VERSION=$($cfg.androidNdk)" >> $env:GITHUB_ENV
          $sdkRoot = if ($env:ANDROID_HOME) { $env:ANDROID_HOME } elseif ($env:ANDROID_SDK_ROOT) { $env:ANDROID_SDK_ROOT } else { $null }
          if (-not $sdkRoot) { throw "ANDROID_HOME/ANDROID_SDK_ROOT 未設定（runner 應內建 Android SDK）" }
          "ndk-path=$sdkRoot\ndk\$($cfg.androidNdk)" >> $env:GITHUB_OUTPUT
          "dotnet-sdk=$($cfg.dotnetSdk)" >> $env:GITHUB_OUTPUT
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # 1.97.1
        with:
          toolchain: 1.97.1 # rust-toolchain.toml 固定
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ steps.load-toolchain.outputs.dotnet-sdk }}
      - name: Verify installed .NET SDK matches toolchain.json
        shell: pwsh
        run: |
          $actual = dotnet --version
          if ($actual.Trim() -ne $env:DOTNET_SDK_VERSION) {
            throw "dotnet SDK 不符 tools/toolchain.json：需要 $env:DOTNET_SDK_VERSION；實際 $actual"
          }
      - name: Install MAUI Android workload
        shell: pwsh
        run: dotnet workload install maui-android --version $env:MAUI_WORKLOAD_SET
      # 不依賴 runner 預設 NDK：只快取 pin 版本的 ndk 目錄（key 隨 toolchain.json 變動），
      # 未命中時以 sdkmanager 安裝精確版本，並覆寫 ANDROID_NDK_HOME 供 build-core 使用。
      - name: Cache pinned Android NDK
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.load-toolchain.outputs.ndk-path }}
          key: android-ndk-${{ hashFiles('tools/toolchain.json') }}
      - name: Install pinned Android NDK
        shell: pwsh
        run: |
          $sdkRoot = if ($env:ANDROID_HOME) { $env:ANDROID_HOME } else { $env:ANDROID_SDK_ROOT }
          $ndkDir = Join-Path $sdkRoot ("ndk\" + $env:ANDROID_NDK_VERSION)
          if (-not (Test-Path -LiteralPath (Join-Path $ndkDir "source.properties") -PathType Leaf)) {
            $sdkmanager = Join-Path $sdkRoot "cmdline-tools\latest\bin\sdkmanager.bat"
            if (-not (Test-Path -LiteralPath $sdkmanager -PathType Leaf)) { throw "找不到 sdkmanager：$sdkmanager" }
            & $sdkmanager --sdk_root=$sdkRoot "ndk;$env:ANDROID_NDK_VERSION"
            if ($LASTEXITCODE -ne 0) { throw "sdkmanager 安裝 NDK $env:ANDROID_NDK_VERSION 失敗（退出碼 $LASTEXITCODE）" }
            if (-not (Test-Path -LiteralPath (Join-Path $ndkDir "source.properties") -PathType Leaf)) { throw "NDK 安裝後缺少 source.properties：$ndkDir" }
          }
          "ANDROID_NDK_HOME=$ndkDir" >> $env:GITHUB_ENV
      - name: Install cargo-ndk
        shell: pwsh
        run: |
          cargo install cargo-ndk --version $env:CARGO_NDK_VERSION --locked
          $version = cargo ndk --version
          if ($version -notmatch ('cargo-ndk ' + [regex]::Escape($env:CARGO_NDK_VERSION))) { throw "Unexpected cargo-ndk version: $version" }
      - name: Build Android native core
        shell: pwsh
        run: ./tools/build-core.ps1 -Head android
      - name: Install Android platform dependencies
        shell: pwsh
        run: dotnet build ui/Ui.csproj -f net11.0-android -t:InstallAndroidDependencies -p:AcceptAndroidSDKLicenses=True
      - name: Build Android UI
        shell: pwsh
        run: dotnet build ui/Ui.csproj -f net11.0-android -c Release
