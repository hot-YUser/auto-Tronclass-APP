name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust tests and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - name: Test
        run: cargo test --manifest-path core/Cargo.toml --all-targets --all-features
      - name: Clippy
        run: cargo clippy --manifest-path core/Cargo.toml --all-targets --all-features -- -D warnings

  windows:
    name: Windows UI and contract checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '11.0.100-preview.6.26359.118'
      - name: Build Windows native core
        shell: pwsh
        run: ./build-core.ps1 -Head windows
      - name: Build Windows UI
        shell: pwsh
        run: dotnet build ui/Ui.csproj -f net11.0-windows10.0.19041.0 -c Release -p:TargetFrameworks=net11.0-windows10.0.19041.0
      - name: Run protocol contract check
        shell: pwsh
        run: dotnet run --project checks/ProtocolContract.Check/ProtocolContract.Check.csproj -c Release
      - name: Run device-key check
        shell: pwsh
        run: dotnet run --project checks/DeviceKey.Check/DeviceKey.Check.csproj -c Release

  android:
    name: Android UI and native ABI build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '11.0.100-preview.6.26359.118'
      - name: Install MAUI Android workload
        shell: pwsh
        run: dotnet workload install maui-android --version 11.0.100-preview.6.26364.2 --skip-manifest-update
      - name: Install cargo-ndk
        shell: pwsh
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          $version = cargo ndk --version
          if ($version -notmatch 'cargo-ndk 4\.1\.2') { throw "Unexpected cargo-ndk version: $version" }
      - name: Build Android native core
        shell: pwsh
        run: ./build-core.ps1 -Head android
      - name: Install Android platform dependencies
        shell: pwsh
        run: dotnet build ui/Ui.csproj -f net11.0-android -t:InstallAndroidDependencies -p:AcceptAndroidSDKLicenses=True
      - name: Build Android UI
        shell: pwsh
        run: dotnet build ui/Ui.csproj -f net11.0-android -c Release
